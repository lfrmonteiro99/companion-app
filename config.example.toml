# Non-secret runtime configuration. Copy to `config.toml` to activate.
# Values here are overridden by CLI flags of the same name.

[gate]
# Keywords that force an immediate API send on the "emotional" gate rule.
# Case-insensitive. Match against both mic transcripts and on-screen text.
frustration_keywords = [
  "não percebo", "não funciona", "por amor", "merda", "caralho",
  "wtf", "why the hell", "this is broken", "not working", "foda-se",
  "impossível", "broken", "crash", "error", "failed",
]

[gate.tuning]
app_time_threshold_minutes = 25
periodic_check_minutes = 2
text_new_words_threshold = 5
text_change_cooldown_seconds = 6
# Minimum seconds between voice_activity sends. Lower = more responsive
# always-listen alerts, but higher OpenAI spend on a talkative day.
voice_cooldown_seconds = 5

[runtime]
# Minimum wall-clock interval between API sends, across all gate rules.
# "emotional" events bypass this cooldown.
min_send_interval_seconds = 15
# Rolling mic-transcript window: how many recent whisper chunks get joined
# into the context passed to the AI. More context = better voice_reply answers,
# but longer prompts = higher cost.
transcript_window_size = 5

[tts]
# Speak alert messages aloud in addition to the desktop notification.
enabled = true
# Override the TTS binary. Leave unset to auto-detect:
# spd-say (speech-dispatcher) > espeak-ng > espeak > say (macOS).
# command = "spd-say"

[llm]
# OpenAI-compatible chat endpoint. Default targets the OMEN Ollama
# server over Tailscale. Override with --llm-base-url or
# AWARENESS_LLM_BASE_URL.
# base_url = "http://100.68.73.123:11434/v1"
# Local model identifier as known to the endpoint. qwen3:8b is the
# default after benchmarking on the OMEN RTX 2060: clean PT-EU register,
# correct chat-direction reading, no Chinese leak (qwen2.5:7b leaks it),
# ~3s warm latency for a 200-token reply.
# model = "qwen3:8b"
# Hard HTTP timeout per chat-completion call. Cold-load of an 8B Q4 model
# on the OMEN takes ~25s, so 30s default keeps the first tick of a cold
# run from failing.
# timeout_seconds = 30

[vision]
# When enabled, a downscaled screenshot of the active window is attached to
# every analysis call so the model reasons over the actual pixels (reels,
# video, photos, charts, layout). Requires a vision-capable, NON-THINKING
# model that follows `format:"json"` — set [llm] model accordingly.
#
# Benchmarked on the OMEN RTX 2060 (Ollama 0.24.0):
#   gemma3:4b   — RECOMMENDED. Clean PT-EU JSON, token-efficient vision,
#                 fits 6GB alone (no swap), ~11s/call.
#   llava:7b    — works but answers in English, heavier image tokens.
#   qwen3-vl:4b — UNSUPPORTED: thinking model; `format:"json"` yields empty
#                 output and reasoning blows past the token budget.
# To use vision:  --vision-enabled true --llm-model gemma3:4b
# Cost: vision-mode calls are slower (~11s) than the text-only path (~3s).
# enabled = false
# Longest edge (px) the screenshot is downscaled to before sending. Lower =
# fewer image tokens = faster/cheaper, but less legible. Min 64.
# max_image_px = 1024

[media_audio]
# When enabled, transcribes system (loopback/monitor) audio while a media
# app is foreground, so a reel's soundtrack feeds the analysis as text.
# Requires a PipeWire/PulseAudio ".monitor" source; degrades to a warning
# if none is found. (Implemented in sub-phase 1b.)
# enabled = false
